      metrics.className = "chip-metrics";
      metrics.append(
        renderChipMetric("On Roll", bucket.on, "on"),
        renderChipMetric("Off Roll", bucket.off, "off")
      );

      chip.append(labelEl, valueEl, metrics);
      return chip;
    }

    function renderBandMatrixChip(insights) {
      const chip = document.createElement("div");
      chip.className = "insight-chip band-matrix-chip";
      const title = document.createElement("h4");
      title.textContent = "Band vs Role (On-Roll)";
      chip.appendChild(title);

      if (!insights?.hasBandColumn) {
        chip.appendChild(renderEmptyState("Band column not available in the upload."));
        return chip;
      }

      const { bands, roles, counts } = insights.bandMatrix || { bands: [], roles: [], counts: {} };
      if (!bands.length || !roles.length) {
        chip.appendChild(renderEmptyState("No on-roll band data found."));
        return chip;
      }

      const preferredOrder = ["SDM", "Developer", "PMO", "QA"];
      const orderedRoles = [
        ...preferredOrder.filter((role) => roles.includes(role)),
        ...roles.filter((role) => !preferredOrder.includes(role)).sort()
      ];

      const wrapper = document.createElement("div");
      wrapper.className = "band-matrix-wrapper";
      const table = document.createElement("table");
      table.className = "band-matrix";
      const headerRow = document.createElement("tr");
      const bandHeader = document.createElement("th");
      bandHeader.textContent = "Band";
      headerRow.appendChild(bandHeader);
      orderedRoles.forEach((role) => {
        const th = document.createElement("th");
        th.textContent = role;
        headerRow.appendChild(th);
      });
      const totalHeader = document.createElement("th");
      totalHeader.textContent = "Total";
      headerRow.appendChild(totalHeader);
      table.appendChild(headerRow);

      const columnTotals = Object.fromEntries(orderedRoles.map((role) => [role, 0]));
      let grandTotal = 0;

      bands.forEach((band) => {
        const row = document.createElement("tr");
        const bandCell = document.createElement("td");
        bandCell.textContent = band;
        row.appendChild(bandCell);
        let rowTotal = 0;
        orderedRoles.forEach((role) => {
          const cell = document.createElement("td");
          const value = counts?.[band]?.[role] || 0;
          cell.textContent = value;
          rowTotal += value;
          columnTotals[role] += value;
          row.appendChild(cell);
        });
        const totalCell = document.createElement("td");
        totalCell.textContent = rowTotal;
        row.appendChild(totalCell);
        grandTotal += rowTotal;
        table.appendChild(row);
      });

      const totalsRow = document.createElement("tr");
      const totalsLabel = document.createElement("td");
      totalsLabel.textContent = "Total";
      totalsRow.appendChild(totalsLabel);
      orderedRoles.forEach((role) => {
        const cell = document.createElement("td");
        cell.textContent = columnTotals[role];
        totalsRow.appendChild(cell);
      });
      const grandCell = document.createElement("td");
      grandCell.textContent = grandTotal;
      totalsRow.appendChild(grandCell);
      table.appendChild(totalsRow);

      wrapper.appendChild(table);
      chip.appendChild(wrapper);
      return chip;
    }

    function renderOnRollLocationChip(insights) {
      const chip = document.createElement("div");
      chip.className = "insight-chip location-chip";
      const title = document.createElement("h4");
      title.textContent = "On-Roll (Pune / ODC)";
      chip.appendChild(title);

      if (!insights?.hasLocationColumn) {
        chip.appendChild(renderEmptyState("Location column not available in the upload."));
        return chip;
      }

      const onRoll = insights.location?.onRoll || { pune: 0, odc: 0, other: 0 };
      const onRollTable = renderLocationTable([
        { label: "Pune", count: onRoll.pune },
        { label: "ODC", count: onRoll.odc },
        ...(onRoll.other ? [{ label: "Other", count: onRoll.other }] : [])
      ]);
      chip.appendChild(onRollTable);
      return chip;
    }

    function renderOffRollLocationChip(insights) {
      const chip = document.createElement("div");
      chip.className = "insight-chip location-chip";
      const title = document.createElement("h4");
      title.textContent = "Off-Roll (Unique by Location)";
      chip.appendChild(title);

      if (!insights?.hasLocationColumn) {
        chip.appendChild(renderEmptyState("Location column not available in the upload."));
        return chip;
      }

      const offRoll = insights.location?.offRoll || [];
      const offRollTable = renderLocationTable(
        offRoll.length ? offRoll.map((entry) => ({ label: entry.location, count: entry.count })) : []
      );
      if (!offRoll.length) {
        offRollTable.appendChild(renderEmptyState("No off-roll location data found."));
      }
      chip.appendChild(offRollTable);
      return chip;
    }

    function renderLocationTable(rows) {
      const table = document.createElement("table");
      table.className = "location-table";
      if (!rows.length) {
        table.classList.add("empty");
        return table;
      }
      const headerRow = document.createElement("tr");
      const locationHeader = document.createElement("th");
      locationHeader.textContent = "Location";
      const countHeader = document.createElement("th");
      countHeader.textContent = "Count";
      headerRow.append(locationHeader, countHeader);
      table.appendChild(headerRow);
      let total = 0;
      rows.forEach((row) => {
        const tr = document.createElement("tr");
        const label = document.createElement("td");
        label.textContent = row.label;
        const count = document.createElement("td");
        count.textContent = row.count;
        total += Number(row.count) || 0;
        tr.append(label, count);
        table.appendChild(tr);
      });
      const totalRow = document.createElement("tr");
      const totalLabel = document.createElement("td");
      totalLabel.textContent = "Total";
      const totalValue = document.createElement("td");
      totalValue.textContent = total;
      totalRow.append(totalLabel, totalValue);
      table.appendChild(totalRow);
      return table;
    }

    function renderChipMetric(label, value, variantClass) {
      const row = document.createElement("div");
      row.className = "chip-metric";
      const tag = document.createElement("span");
      tag.className = `chip-tag ${variantClass}`;
      tag.textContent = label;
      const val = document.createElement("span");
      val.textContent = value;
      row.append(tag, val);
      return row;
    }

    function renderInputControl(label, type, value, onChange) {
      const wrapper = document.createElement("label");
      wrapper.textContent = label;
      const input = document.createElement("input");
      input.type = type;
      input.value = value;
      input.addEventListener("input", (event) => onChange(event.target.value));
      wrapper.appendChild(input);
      return wrapper;
    }

    function renderSelectControl(label, options, selected, onChange) {
      const wrapper = document.createElement("label");
      wrapper.textContent = label;
      const select = document.createElement("select");
      options.forEach((option) => {
        const optionValue = typeof option === "object" ? option.value : option;
        const optionLabel = typeof option === "object" ? option.label : option;
        const optionEl = document.createElement("option");
        optionEl.value = optionValue;
        optionEl.textContent = optionLabel || "(none)";
        optionEl.selected = optionValue === selected;
        select.appendChild(optionEl);
      });
      select.addEventListener("change", (event) => onChange(event.target.value));
      wrapper.appendChild(select);
      return wrapper;
    }

    function renderTable(headers, rows, extraHeaders = []) {
      const table = document.createElement("table");
      const thead = document.createElement("thead");
      const headerRow = document.createElement("tr");
      const extraHeaderSet = new Set(extraHeaders);
      headers.forEach((header) => {
        const th = document.createElement("th");
        th.textContent = header;
        if (extraHeaderSet.has(header)) {
          th.classList.add("header-warning");
        }
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);

      const tbody = document.createElement("tbody");
      rows.forEach((row) => {
        const tr = document.createElement("tr");
        headers.forEach((header) => {
          const td = document.createElement("td");
          td.textContent = row[header] ?? "";
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });

      table.append(thead, tbody);
      return table;
    }

    function renderStructureMismatchSection(items) {
      const section = document.createElement("div");
      section.className = "card accent-warning";
      const heading = document.createElement("h3");
      heading.className = "section-title";
      heading.textContent = "POD Structure Mismatch";
      section.appendChild(heading);

      const note = document.createElement("div");
      note.className = "governance-note";
      note.textContent = "Comparison against expected tier structure (role + on/off roll).";

      const list = document.createElement("div");
      list.className = "governance-list";

      if (!items.length) {
        list.appendChild(renderEmptyState("No issues found."));
      } else {
        items.forEach((item) => {
          const block = document.createElement("div");
          block.className = "governance-item";
          const header = document.createElement("strong");
          header.textContent = `${item.pod} — ${item.podName} (${item.tier})`;
          const reasons = document.createElement("ul");
          item.reasons.forEach((reason) => {
            const li = document.createElement("li");
            li.textContent = reason;
            reasons.appendChild(li);
          });
          block.append(header, reasons);
          list.appendChild(block);
        });
      }

      section.append(note, list);
      return section;
    }

    function renderLeadershipIssuesSection(issues) {
      const section = document.createElement("div");
      section.className = "card accent-danger";
      const heading = document.createElement("h3");
      heading.className = "section-title";
      heading.textContent = "Leadership Assignment Issues";
      section.appendChild(heading);

      const note = document.createElement("div");
      note.className = "governance-note";
      note.textContent = "Missing, blank, or TBH leadership fields by role.";

      const list = document.createElement("div");
      list.className = "governance-list";

      const groups = [
        { label: "PMO Senior Lead", items: issues.pmoSenior || [] },
        { label: "Principal Architect", items: issues.principal || [] },
        { label: "Technical Architect", items: issues.technical || [] },
        { label: "PMO Lead", items: issues.pmoLead || [] },
        { label: "QA Lead", items: issues.qaLead || [] }
      ];
      const totalIssues = groups.reduce((sum, group) => sum + group.items.length, 0);

      if (!totalIssues) {
        list.appendChild(renderEmptyState("No issues found."));
      } else {
        groups.forEach((group) => {
          const block = document.createElement("div");
          block.className = "governance-item";
          const header = document.createElement("strong");
          header.textContent = group.label;
          const groupList = document.createElement("ul");
          if (!group.items.length) {
            const li = document.createElement("li");
            li.textContent = "No issues found.";
            groupList.appendChild(li);
          } else {
            group.items.forEach((issue) => {
              const li = document.createElement("li");
              li.textContent = `${issue.pod} — ${issue.reason}`;
              groupList.appendChild(li);
            });
          }
          block.append(header, groupList);
          list.appendChild(block);
        });
      }

      section.append(note, list);
      return section;
    }

    function renderDuplicatesSection(duplicates) {
      const section = document.createElement("div");
      section.className = "card accent-info";
      const heading = document.createElement("h3");
      heading.className = "section-title";
      heading.textContent = "Duplicate Resource Names";
      section.appendChild(heading);

      const note = document.createElement("div");
      note.className = "governance-note";
      note.textContent = "Confirmed duplicates span multiple PODs; possible duplicates require verification.";

      const formatName = (name) =>
        String(name || "")
          .trim()
          .split(/\s+/)
          .map((part) => (part ? part[0].toUpperCase() + part.slice(1).toLowerCase() : ""))
          .join(" ");

      const list = document.createElement("div");
      list.className = "governance-list";

      const confirmedBlock = document.createElement("div");
      confirmedBlock.className = "governance-item";
      const confirmedTitle = document.createElement("strong");
      confirmedTitle.textContent = "Confirmed";
      const confirmedList = document.createElement("ul");
      if (!duplicates.confirmed.length) {
        const li = document.createElement("li");
        li.textContent = "No issues found.";
        confirmedList.appendChild(li);
      } else {
        duplicates.confirmed.forEach((duplicate) => {
          const li = document.createElement("li");
          const entries = duplicate.entries.map((entry) => `${entry.pod} (${entry.role})`).join(", ");
          li.textContent = `${formatName(duplicate.name)}: ${entries}`;
          confirmedList.appendChild(li);
        });
      }
      confirmedBlock.append(confirmedTitle, confirmedList);

      const possibleBlock = document.createElement("div");
      possibleBlock.className = "governance-item";
      const possibleTitle = document.createElement("strong");
      possibleTitle.textContent = "Needs Verification";
      const possibleList = document.createElement("ul");
      if (!duplicates.possible.length) {
        const li = document.createElement("li");
        li.textContent = "No issues found.";
        possibleList.appendChild(li);
      } else {
        duplicates.possible.forEach((duplicate) => {
          const li = document.createElement("li");
          const pods = duplicate.pods.length ? ` — Pods: ${duplicate.pods.join(", ")}` : "";
          li.textContent = `${duplicate.nameVariants.map(formatName).join(" / ")}${pods}`;
          possibleList.appendChild(li);
        });
      }
      possibleBlock.append(possibleTitle, possibleList);

      list.append(confirmedBlock, possibleBlock);
      section.append(note, list);
      return section;
    }

    function renderOnOffIssuesSection(items) {
      const section = document.createElement("div");
      section.className = "card accent-neutral";
      const heading = document.createElement("h3");
      heading.className = "section-title";
      heading.textContent = "On-Roll / Off-Roll Inconsistencies";
      section.appendChild(heading);

      const note = document.createElement("div");
      note.className = "governance-note";
      note.textContent = "Validates employment type against tier-specific expectations.";

      const list = document.createElement("ul");
      list.className = "governance-list";

      if (!items.length) {
        list.appendChild(renderEmptyState("No issues found."));
      } else {
        items.forEach((item) => {
          const li = document.createElement("li");
          li.textContent = `${item.pod} — ${item.role} (${item.resource}): ${item.reason}`;
          list.appendChild(li);
        });
      }

      section.append(note, list);
      return section;
    }

    function renderPodHealthSection(buckets) {
      const section = document.createElement("div");
      section.className = "card accent-neutral";
      const heading = document.createElement("h3");
      heading.className = "section-title";
      heading.textContent = "POD Health Categories";
      section.appendChild(heading);

      const note = document.createElement("div");
      note.className = "governance-note";
      note.textContent = "Categorized by total issue count per POD with leader reference.";

      const summary = document.createElement("div");
      summary.className = "governance-summary";

      const categories = [
        { key: "critical", label: "Needs Significant Improvement", badge: "≥ 5 issues" },
        { key: "significant", label: "Needs Improvement", badge: "3-4 issues" },
        { key: "improvement", label: "Minor Issues", badge: "1-2 issues" },
        { key: "perfect", label: "Perfect", badge: "0 issues" }
      ];

      categories.forEach((category) => {
        const block = document.createElement("div");
        block.className = "governance-item";
        const titleRow = document.createElement("div");
        titleRow.style.display = "flex";
        titleRow.style.justifyContent = "space-between";
        titleRow.style.alignItems = "center";
        const label = document.createElement("strong");
        label.textContent = category.label;
        const badge = document.createElement("span");
        badge.className = `badge ${category.key}`;
        badge.textContent = category.badge;
        titleRow.append(label, badge);

        const list = document.createElement("div");
        list.className = "pod-health-grid";

        const items = buckets[category.key] || [];
        if (!items.length) {
          list.appendChild(renderEmptyState("No pods in this category."));
        } else {
          items.forEach((pod) => {
            const item = document.createElement("div");
            item.className = "pod-health-item";
            const name = document.createElement("strong");
            name.textContent = `${pod.podNumber} — ${pod.podName}`;
            const meta = document.createElement("span");
            meta.textContent = `Leader: ${pod.leader} · Issues: ${pod.issueCount}`;
            item.append(name, meta);
            list.appendChild(item);
          });
        }

        block.append(titleRow, list);
        summary.appendChild(block);
      });

      section.append(note, summary);
      return section;
    }

    function renderEmptyState(text) {
      const div = document.createElement("div");
      div.className = "empty-state";
      div.textContent = text;
      return div;
    }

    function buildEmptyState(message) {
      document.getElementById("page1").innerHTML = "";
      document.getElementById("page2").innerHTML = "";
      document.getElementById("page3").innerHTML = "";
      document.getElementById("page1").appendChild(renderEmptyState(message));
    }

    // ============================
    // Event Wiring
    // ============================
    document.getElementById("fileInput").addEventListener("change", (event) => {
      const file = event.target.files[0];
      if (file) {
        handleFileUpload(file);
      }
    });

    document.querySelectorAll("nav button").forEach((button) => {
      button.addEventListener("click", () => {
        APP_STATE = {
          ...APP_STATE,
          ui: {
            ...APP_STATE.ui,
            activePage: button.dataset.page
          }
        };
        renderApp(APP_STATE);
      });
    });

    function updatePage1Ui(partial) {
      const updatedPage1 = { ...APP_STATE.ui.page1, ...partial };
      const derivedPage1 = derivePage1(APP_STATE.headers, APP_STATE.rawData, updatedPage1);
      APP_STATE = {
        ...APP_STATE,
        ui: {
          ...APP_STATE.ui,
          page1: updatedPage1
        },
        derived: {
          ...APP_STATE.derived,
          page1: derivedPage1
        }
      };
      renderApp(APP_STATE);
    }

    function updatePage2Ui(partial) {
      const updatedPage2 = { ...APP_STATE.ui.page2, ...partial };
      const derivedPage2 = derivePage2(APP_STATE.headers, APP_STATE.rawData, updatedPage2);
      APP_STATE = {
        ...APP_STATE,
        ui: {
          ...APP_STATE.ui,
          page2: updatedPage2
        },
        derived: {
          ...APP_STATE.derived,
          page2: derivedPage2
        }
      };
      renderApp(APP_STATE);
    }

    function updatePage3Ui(partial) {
      const updatedPage3 = { ...APP_STATE.ui.page3, ...partial };
      APP_STATE = {
        ...APP_STATE,
        ui: {
          ...APP_STATE.ui,
          page3: updatedPage3
        }
      };
      renderApp(APP_STATE);
    }

    renderApp(APP_STATE);
  </script>
</body>
</html>
