<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>POD Structure Governance Dashboard (Offline)</title>
  <style>
    :root {
      --primary-color: #1d4ed8;
      --info-color: #0284c7;
      --warning-color: #d97706;
      --error-color: #dc2626;
      --bg-color: #0f172a;
      --surface-color: #111827;
      --surface-alt: #1f2937;
      --text-color: #e5e7eb;
      --muted-text: #94a3b8;
      --chip-radius: 12px;
      --spacing-xs: 6px;
      --spacing-sm: 10px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --font-sm: 12px;
      --font-md: 14px;
      --font-lg: 18px;
      --font-xl: 24px;
      --border-color: #334155;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.45);
      --bar-height: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
    }

    header {
      padding: var(--spacing-lg);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      background: linear-gradient(120deg, rgba(30, 64, 175, 0.35), rgba(15, 23, 42, 0.85));
    }

    header h1 {
      margin: 0;
      font-size: var(--font-xl);
      font-weight: 600;
    }

    .upload-panel {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--spacing-sm);
      font-size: var(--font-md);
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: var(--spacing-sm) var(--spacing-md);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
      min-width: 360px;
    }

    .upload-panel input[type="file"] {
      background: var(--surface-alt);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: var(--spacing-xs);
      border-radius: 8px;
      min-width: 260px;
      flex: 1 1 320px;
    }

    .upload-panel button {
      background: var(--primary-color);
      border: none;
      color: white;
      padding: var(--spacing-xs) var(--spacing-md);
      border-radius: 999px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .upload-panel button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.3);
    }

    .upload-panel button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    nav {
      display: flex;
      gap: var(--spacing-sm);
      padding: var(--spacing-sm) var(--spacing-lg);
      border-bottom: 1px solid var(--border-color);
      background: linear-gradient(180deg, rgba(37, 99, 235, 0.08), transparent);
    }

    nav button {
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: var(--spacing-sm) var(--spacing-lg);
      border-radius: 999px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, color 0.2s ease;
    }

    nav button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.12);
      border-color: rgba(37, 99, 235, 0.4);
    }

    nav button.active {
      background: var(--primary-color);
      border-color: var(--primary-color);
      color: white;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
    }

    main {
      padding: var(--spacing-lg);
      display: grid;
      gap: var(--spacing-lg);
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .page .card + .card {
      margin-top: var(--spacing-md);
    }

    .card {
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: var(--spacing-lg);
      box-shadow: var(--shadow);
    }

    .grid {
      display: grid;
      gap: var(--spacing-md);
    }

    .grid.kpi {
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    }

    .grid.summary-row {
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    }

    .grid.summary-row + .grid.summary-row {
      margin-top: var(--spacing-md);
    }
    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--spacing-sm);
      padding: var(--spacing-sm) var(--spacing-md);
      border-radius: var(--chip-radius);
      background: var(--surface-alt);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      min-width: 140px;
    }

    .chip.vertical {
      flex-direction: column;
      align-items: flex-start;
    }

    .chip .label {
      font-size: var(--font-sm);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted-text);
    }

    .chip .value {
      font-size: var(--font-lg);
      font-weight: 600;
    }

    .chip-metrics {
      display: grid;
      gap: var(--spacing-xs);
      margin-top: var(--spacing-xs);
      width: 100%;
    }

    .chip-metric {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: var(--font-sm);
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(148, 163, 184, 0.08);
      border: 1px solid rgba(148, 163, 184, 0.25);
    }

    .chip-tag {
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted-text);
    }

    .chip-tag.on { color: #38bdf8; }
    .chip-tag.off { color: #f59e0b; }

    .chip.primary { border-color: rgba(37, 99, 235, 0.6); }
    .chip.info { border-color: rgba(2, 132, 199, 0.6); }
    .chip.warning { border-color: rgba(217, 119, 6, 0.6); }
    .chip.error { border-color: rgba(220, 38, 38, 0.6); }

    .chip.sm { padding: var(--spacing-xs) var(--spacing-sm); font-size: var(--font-sm); }
    .chip.md { padding: var(--spacing-sm) var(--spacing-md); }
    .chip.lg { padding: var(--spacing-md) var(--spacing-lg); }

    .chip.square { border-radius: 6px; }
    .chip.rounded { border-radius: 12px; }
    .chip.pill { border-radius: 999px; }

    .section-title {
      margin: 0 0 var(--spacing-md);
      font-size: var(--font-lg);
    }

    .muted {
      color: var(--muted-text);
      font-size: var(--font-sm);
    }

    .table-controls {
      display: flex;
      flex-wrap: wrap;
      gap: var(--spacing-sm);
      margin-bottom: var(--spacing-md);
    }

    .table-controls label {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-xs);
      font-size: var(--font-sm);
    }

    .table-controls input,
    .table-controls select {
      background: var(--surface-alt);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: var(--spacing-xs);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: var(--font-sm);
    }

    th, td {
      padding: var(--spacing-sm);
      border-bottom: 1px solid var(--border-color);
      text-align: left;
    }

    th {
      background: var(--surface-alt);
      position: sticky;
      top: 0;
      z-index: 1;
    }

    tbody tr:hover {
      background: rgba(148, 163, 184, 0.08);
    }

    .governance-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--spacing-md);
    }

    .governance-toolbar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-md);
    }

    .governance-toolbar label {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-xs);
      font-size: var(--font-sm);
      font-weight: 600;
    }

    .governance-toolbar select {
      background: var(--surface-alt);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: var(--spacing-xs);
      border-radius: 10px;
    }

    .governance-item {
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: var(--spacing-md);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-xs);
      width: 100%;
    }

    .governance-item ul {
      margin: var(--spacing-sm) 0 0;
      padding-left: 18px;
    }

    .governance-list {
      display: grid;
      gap: var(--spacing-sm);
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .governance-list li {
      line-height: 1.5;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: var(--spacing-xs) var(--spacing-sm);
      display: flex;
      align-items: flex-start;
      width: 100%;
      background: transparent;
    }

    .governance-list strong {
      color: var(--primary-color);
    }

    .governance-note {
      font-style: italic;
      color: var(--muted-text);
    }

    .accent-warning {
      border-left: 4px solid #f59e0b;
    }

    .accent-danger {
      border-left: 4px solid #ef4444;
    }

    .accent-info {
      border-left: 4px solid #38bdf8;
    }

    .accent-success {
      border-left: 4px solid #22c55e;
    }

    .accent-neutral {
      border-left: 4px solid #94a3b8;
    }

    .accent-warning .section-title,
    .accent-warning .governance-item strong {
      color: #b45309;
    }

    .accent-danger .section-title,
    .accent-danger .governance-item strong {
      color: #b91c1c;
    }

    .accent-info .section-title,
    .accent-info .governance-item strong {
      color: #0369a1;
    }

    .accent-success .section-title,
    .accent-success .governance-item strong {
      color: #166534;
    }

    .accent-neutral .section-title,
    .accent-neutral .governance-item strong {
      color: #475569;
    }

    .badge.critical {
      background: rgba(248, 113, 113, 0.2);
      color: #991b1b;
    }

    .badge.significant {
      background: rgba(251, 191, 36, 0.2);
      color: #92400e;
    }

    .badge.improvement {
      background: rgba(56, 189, 248, 0.2);
      color: #075985;
    }

    .badge.perfect {
      background: rgba(74, 222, 128, 0.2);
      color: #166534;
    }

    .governance-summary {
      display: grid;
      gap: var(--spacing-md);
    }

    .pod-health-grid {
      display: grid;
      gap: var(--spacing-sm);
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    }

    .pod-health-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: var(--spacing-xs) var(--spacing-sm);
      border-radius: 10px;
      background: rgba(148, 163, 184, 0.12);
      width: 100%;
    }

    .pod-health-item strong {
      font-size: var(--font-sm);
    }

    .pod-health-item span {
      font-size: var(--font-xs);
      color: var(--muted-text);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: var(--font-xs);
      font-weight: 600;
      background: rgba(37, 99, 235, 0.12);
      color: var(--primary-color);
    }

    .bar-group {
      display: grid;
      gap: var(--spacing-sm);
    }

    .bar-row {
      display: grid;
      grid-template-columns: 160px auto 60px;
      align-items: center;
      gap: var(--spacing-sm);
      font-size: var(--font-sm);
    }

    .bar-track {
      background: transparent;
      border-radius: 999px;
      height: var(--bar-height);
      overflow: hidden;
      border: none;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, rgba(37, 99, 235, 0.85), rgba(14, 165, 233, 0.85));
      width: 0%;
    }

    .bar-value {
      text-align: right;
      color: var(--muted-text);
    }

    .insights-grid {
      display: grid;
      gap: var(--spacing-md);
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    }

    .insight-chip {
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: var(--spacing-md);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
    }

    .insight-chip.band-matrix-chip {
      grid-column: span 1;
    }

    .insight-chip h4 {
      margin: 0;
      font-size: var(--font-md);
    }

    .band-matrix-wrapper {
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: var(--spacing-sm);
      background: var(--surface-alt);
    }

    .band-matrix {
      width: 100%;
      border-collapse: collapse;
      font-size: var(--font-xs);
    }

    .band-matrix th,
    .band-matrix td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-color);
      text-align: center;
    }

    .band-matrix td:first-child,
    .band-matrix th:first-child {
      text-align: left;
      font-weight: 600;
    }

    .band-matrix th {
      color: var(--muted-text);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .band-matrix tr:nth-child(even) td {
      background: rgba(148, 163, 184, 0.08);
    }

    .location-table {
      width: 100%;
      border-collapse: collapse;
      font-size: var(--font-sm);
    }

    .location-table th,
    .location-table td {
      padding: 6px 8px;
      border-bottom: 1px solid var(--border-color);
      text-align: left;
    }

    .location-table th {
      color: var(--muted-text);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .ownership-controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-md);
    }

    .ownership-controls label {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-xs);
      font-size: var(--font-sm);
    }

    .ownership-controls select {
      background: var(--surface-alt);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: var(--spacing-xs);
      border-radius: 8px;
    }

    .pod-list {
      display: grid;
      gap: var(--spacing-xs);
      margin-top: var(--spacing-sm);
      font-size: var(--font-sm);
    }

    .pod-list-item {
      display: grid;
      grid-template-columns: 90px 1fr 1.2fr 140px;
      gap: var(--spacing-sm);
      padding: var(--spacing-xs) var(--spacing-sm);
      border-radius: 8px;
      background: rgba(148, 163, 184, 0.08);
    }

    .pod-list-header {
      font-weight: 600;
      color: var(--muted-text);
      background: transparent;
      border: 1px dashed rgba(148, 163, 184, 0.4);
    }

    .pod-list-modules {
      font-size: var(--font-xs);
      color: var(--muted-text);
    }

    .header-warning {
      color: #b45309;
      background: rgba(251, 191, 36, 0.12);
    }

    .error-banner {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #b91c1c;
      padding: var(--spacing-sm) var(--spacing-md);
      border-radius: 12px;
      font-size: var(--font-sm);
    }

    .empty-state {
      padding: var(--spacing-lg);
      text-align: center;
      color: var(--muted-text);
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>POD Structure Governance Dashboard</h1>
      <div class="muted">Offline, deterministic, single-source governance view</div>
    </div>
    <div class="upload-panel">
      <label for="fileInput">Upload Excel (.xlsx, .xls)</label>
      <input type="file" id="fileInput" accept=".xlsx,.xls" />
    </div>
  </header>
  <nav>
    <button data-page="page1" class="active">Summary</button>
    <button data-page="page3">POD Structure Governance</button>
    <button data-page="page2">POD Structure</button>
  </nav>
  <main>
    <section id="page1" class="page active"></section>
    <section id="page2" class="page"></section>
    <section id="page3" class="page"></section>
  </main>

  <script>
    // ============================
    // State
    // ============================
    const DEFAULT_UI_STATE = {
      activePage: "page1",
      page1: {
        ownershipRole: "PMO Senior Lead",
        ownershipLeader: ""
      },
      page3: {
        selectedPod: "All"
      },
      page2: {
        searchTerm: "",
        sortKey: "",
        sortDir: "asc",
        tierFilter: "All",
        rollFilter: "All"
      }
    };

    let APP_STATE = {
      rawData: [],
      headers: [],
      derived: {
        page1: {},
        page2: {},
        page3: {}
      },
      ui: { ...DEFAULT_UI_STATE }
    };

    const CONFIG = {
      leadershipRoles: ["pod lead", "product owner", "tech lead", "engineering lead"],
      expectedColumns: {
        serialNumber: "S.No",
        podNumber: "# POD",
        podName: "POD Name",
        podTier: "POD Tier",
        resourceName: "Resource Name",
        role: "Role Title",
        rowTitle: "Row Title",
        rollStatus: "ON-Roll / Off-Roll",
        band: "Band",
        location: "Location",
        azurePodName: "Azure POD Name",
        pmoSeniorLead: "PMO Senior Lead",
        principalArchitect: "Principal Architect",
        technicalArchitect: "Technical Architect",
        pmoLead: "PMO Lead",
        qaLead: "QA Lead",
        module1: "Module1",
        module2: "Module2",
        module3: "Module3",
        module4: "Module4",
        module5: "Module5",
        module6: "Module6",
        module7: "Module7",
        module8: "Module8",
        module9: "Module9",
        module10: "Module10"
      },
      leadershipRoleFilters: {
        "PMO Senior Lead": ["pmo senior lead", "pmo sr lead", "senior pmo lead"],
        "PMO Lead": ["pmo lead"],
        "Principal Architect": ["principal architect", "principal arch"],
        "Technical Architect": ["technical architect", "tech architect"],
        "QA Leads": ["qa lead", "quality lead", "qa manager"]
      },
      leadershipRoleOptions: ["All", "PMO Senior Lead", "Principal Architect", "Technical Architect", "PMO Lead"],
      tierRoleExpectations: {
        "tier 1": ["pod lead", "product owner", "tech lead"],
        "tier 2": ["pod lead", "tech lead"],
        "tier 3": ["pod lead"]
      }
    };

    // ============================
    // Parsing
    // ============================
    async function handleFileUpload(file) {
      const buffer = await file.arrayBuffer();
      const extension = file.name.toLowerCase().split(".").pop();
      let parsed;

      if (extension === "xlsx") {
        parsed = await parseXlsx(buffer);
      } else {
        parsed = parseLegacyXls(buffer);
      }

      if (!parsed || parsed.headers.length === 0) {
        buildEmptyState("Unable to parse file. Please verify the Excel format.");
        return;
      }

      APP_STATE = buildAppState(parsed.headers, parsed.rows);
      renderApp(APP_STATE);
    }

    function parseLegacyXls(buffer) {
      const text = new TextDecoder("utf-8").decode(buffer);
      if (text.includes("<table")) {
        const doc = new DOMParser().parseFromString(text, "text/html");
        const table = doc.querySelector("table");
        return parseHtmlTable(table);
      }
      if (text.includes("\t") || text.includes(",")) {
        return parseDelimited(text);
      }
      return { headers: [], rows: [] };
    }

    function parseHtmlTable(table) {
      if (!table) {
        return { headers: [], rows: [] };
      }
      const rows = Array.from(table.querySelectorAll("tr"));
      const cells = rows.map((row) => Array.from(row.children).map((cell) => cell.textContent.trim()));
      return normalizeSheet(cells);
    }

    function parseDelimited(text) {
      const normalizedText = collapseQuotedNewlines(text);
      const lines = normalizedText.split(/\r?\n/).filter(Boolean);
      const delimiter = lines[0]?.includes("\t") ? "\t" : ",";
      const rows = lines.map((line) =>
        line
          .split(delimiter)
          .map((cell) => cell.trim())
          .map((cell) => cell.replace(/^"|"$/g, ""))
      );
      return normalizeSheet(rows);
    }

    function collapseQuotedNewlines(text) {
      let inQuotes = false;
      let result = "";
      for (let i = 0; i < text.length; i += 1) {
        const char = text[i];
        if (char === '"') {
          inQuotes = !inQuotes;
          result += char;
          continue;
        }
        if ((char === "\n" || char === "\r") && inQuotes) {
          result += " ";
          continue;
        }
        result += char;
      }
      return result;
    }

    async function parseXlsx(buffer) {
      const entries = await unzipBuffer(buffer);
      const workbookXml = entries["xl/workbook.xml"];
      const sheetXml = entries["xl/worksheets/sheet1.xml"];
      if (!workbookXml || !sheetXml) {
        return { headers: [], rows: [] };
      }
      const sharedStringsXml = entries["xl/sharedStrings.xml"];
      const sharedStrings = sharedStringsXml ? parseSharedStrings(sharedStringsXml) : [];
      const rows = parseSheetXml(sheetXml, sharedStrings);
      return normalizeSheet(rows);
    }

    function normalizeSheet(rows) {
      if (!rows.length) {
        return { headers: [], rows: [] };
      }
      const headerIndex = findHeaderRowIndex(rows);
      const headers = (rows[headerIndex] || []).map((header) => header || "(blank)");
      const dataRows = rows.slice(headerIndex + 1).map((row) => {
        const rowObj = {};
        headers.forEach((header, index) => {
          rowObj[header] = row[index] ?? "";
        });
        return rowObj;
      });
      return { headers, rows: dataRows };
    }

    function findHeaderRowIndex(rows) {
      const expectedTokens = Object.values(CONFIG.expectedColumns).map((label) => normalizeHeader(label));
      let bestIndex = 0;
      let bestScore = -1;
      rows.forEach((row, index) => {
        const normalizedCells = row.map((cell) => normalizeHeader(cell));
        const nonEmptyCount = normalizedCells.filter(Boolean).length;
        if (!nonEmptyCount) return;
        const matchCount = normalizedCells.filter((cell) => expectedTokens.some((token) => cell.includes(token))).length;
        const score = matchCount * 10 + nonEmptyCount;
        if (score > bestScore) {
          bestScore = score;
          bestIndex = index;
        }
      });
      return bestIndex;
    }

    function parseSharedStrings(xmlBytes) {
      const xml = new TextDecoder("utf-8").decode(xmlBytes);
      const doc = new DOMParser().parseFromString(xml, "application/xml");
      const entries = Array.from(doc.getElementsByTagName("si"));
      return entries.map((entry) => {
        const textNodes = Array.from(entry.getElementsByTagName("t"));
        return textNodes.map((node) => node.textContent).join("");
      });
    }

    function parseSheetXml(xmlBytes, sharedStrings) {
      const xml = new TextDecoder("utf-8").decode(xmlBytes);
      const doc = new DOMParser().parseFromString(xml, "application/xml");
      const rowNodes = Array.from(doc.getElementsByTagName("row"));
      return rowNodes.map((rowNode) => {
        const cells = Array.from(rowNode.getElementsByTagName("c"));
        const row = [];
        cells.forEach((cell) => {
          const cellRef = cell.getAttribute("r");
          const colIndex = columnIndexFromCellRef(cellRef);
          const type = cell.getAttribute("t");
          const valueNode = cell.getElementsByTagName("v")[0];
          const inlineNode = cell.getElementsByTagName("is")[0];
          let value = "";

          if (type === "s") {
            const index = Number(valueNode?.textContent || 0);
            value = sharedStrings[index] ?? "";
          } else if (type === "inlineStr" && inlineNode) {
            const textNode = inlineNode.getElementsByTagName("t")[0];
            value = textNode?.textContent || "";
          } else if (valueNode) {
            value = valueNode.textContent || "";
          }

          row[colIndex] = value;
        });
        return row.map((cell) => (cell === undefined ? "" : cell));
      });
    }

    function columnIndexFromCellRef(cellRef) {
      if (!cellRef) return 0;
      const letters = cellRef.replace(/\d/g, "");
      let index = 0;
      for (let i = 0; i < letters.length; i += 1) {
        index = index * 26 + (letters.charCodeAt(i) - 64);
      }
      return index - 1;
    }

    async function unzipBuffer(buffer) {
      const data = new Uint8Array(buffer);
      const view = new DataView(buffer);
      const eocdOffset = findEndOfCentralDirectory(data);
      if (eocdOffset < 0) {
        return {};
      }
      const centralDirSize = view.getUint32(eocdOffset + 12, true);
      const centralDirOffset = view.getUint32(eocdOffset + 16, true);
      const entries = {};
      let pointer = centralDirOffset;
      const end = centralDirOffset + centralDirSize;

      while (pointer < end) {
        const signature = view.getUint32(pointer, true);
        if (signature !== 0x02014b50) {
          break;
        }
        const compression = view.getUint16(pointer + 10, true);
        const compressedSize = view.getUint32(pointer + 20, true);
        const fileNameLength = view.getUint16(pointer + 28, true);
        const extraLength = view.getUint16(pointer + 30, true);
        const commentLength = view.getUint16(pointer + 32, true);
        const localHeaderOffset = view.getUint32(pointer + 42, true);
        const nameStart = pointer + 46;
        const nameBytes = data.slice(nameStart, nameStart + fileNameLength);
        const fileName = new TextDecoder().decode(nameBytes);

        const localSignature = view.getUint32(localHeaderOffset, true);
        if (localSignature !== 0x04034b50) {
          pointer += 46 + fileNameLength + extraLength + commentLength;
          continue;
        }
        const localNameLength = view.getUint16(localHeaderOffset + 26, true);
        const localExtraLength = view.getUint16(localHeaderOffset + 28, true);
        const dataStart = localHeaderOffset + 30 + localNameLength + localExtraLength;
        const compressedData = data.slice(dataStart, dataStart + compressedSize);

        let fileData;
        if (compression === 0) {
          fileData = compressedData;
        } else if (compression === 8) {
          fileData = await inflateRaw(compressedData);
        }

        if (fileData) {
          entries[fileName] = fileData;
        }

        pointer += 46 + fileNameLength + extraLength + commentLength;
      }

      return entries;
    }

    function findEndOfCentralDirectory(data) {
      for (let i = data.length - 22; i >= 0 && i >= data.length - 65557; i -= 1) {
        if (data[i] === 0x50 && data[i + 1] === 0x4b && data[i + 2] === 0x05 && data[i + 3] === 0x06) {
          return i;
        }
      }
      return -1;
    }

    async function inflateRaw(data) {
      const stream = new DecompressionStream("deflate-raw");
      const writer = stream.writable.getWriter();
      writer.write(data);
      writer.close();
      const response = new Response(stream.readable);
      const buffer = await response.arrayBuffer();
      return new Uint8Array(buffer);
    }

    // ============================
    // Derivation
    // ============================
    function buildAppState(headers, rawData) {
      const uiState = { ...DEFAULT_UI_STATE };
      const derived = computeDerivedState(headers, rawData, uiState);
      return {
        rawData,
        headers,
        derived,
        ui: uiState
      };
    }

    function computeDerivedState(headers, rawData, ui) {
      const podStructure = derivePodStructure(headers, rawData);
      return {
        page1: derivePage1(podStructure.headers, podStructure.rows, ui.page1),
        page2: derivePage2(podStructure.headers, podStructure.rows, ui.page2, podStructure.headerIssues),
        page3: derivePage3(podStructure.headers, podStructure.rows)
      };
    }

    function derivePodStructure(headers, rawData) {
      const columnMap = mapColumns(headers);
      const usedHeaders = new Set(Object.values(columnMap).filter(Boolean));
      const missingHeaders = Object.entries(CONFIG.expectedColumns)
        .filter(([key]) => {
          if (key === "rowTitle" && columnMap.role) {
            return false;
          }
          return !columnMap[key];
        })
        .map(([, label]) => label);
      const extraHeaders = headers.filter((header) => !usedHeaders.has(header));
      return {
        headers,
        rows: rawData,
        headerIssues: {
          missingHeaders,
          extraHeaders
        }
      };
    }

    function derivePage1(headers, rawData, page1Ui) {
      const columnMap = mapColumns(headers);
      const podKeySet = new Set();
      const podMetaByKey = {};
      const tierCounts = {};
      const leaderCounts = {};
      const podMembersCount = {};
      let onRoll = 0;
      let offRoll = 0;

      const roleBuckets = {
        sdm: { label: "SDM", total: 0, on: 0, off: 0 },
        developer: { label: "Developer", total: 0, on: 0, off: 0 },
        pmo: { label: "PMO", total: 0, on: 0, off: 0 },
        qa: { label: "QA", total: 0, on: 0, off: 0 }
      };
      const bandRoleMap = {};
      const bandSet = new Set();
      const roleSet = new Set();
      const onRollLocations = { pune: 0, odc: 0, other: 0 };
      const offRollLocationSets = {};
      const podModulesMap = {};

      const leadershipRoleCounts = {};
      Object.keys(CONFIG.leadershipRoleFilters).forEach((role) => {
        leadershipRoleCounts[role] = new Set();
      });

      const leadershipColumns = getLeadershipColumns(columnMap);
      const hasLeadershipColumns = Object.values(leadershipColumns).some(Boolean);
      const hasBandColumn = Boolean(columnMap.band);
      const hasLocationColumn = Boolean(columnMap.location);
      const moduleHeaders = [
        columnMap.module1,
        columnMap.module2,
        columnMap.module3,
        columnMap.module4,
        columnMap.module5,
        columnMap.module6,
        columnMap.module7,
        columnMap.module8,
        columnMap.module9,
        columnMap.module10
      ].filter(Boolean);

      const ownershipMap = buildOwnershipMap(rawData, columnMap);

      rawData.forEach((row) => {
        const podName = getValue(row, columnMap.podName);
        const podNumber = getValue(row, columnMap.podNumber);
        const podKey = podNumber || podName || "(unassigned)";
        if (podName || podNumber) {
          podKeySet.add(podKey);
          podMembersCount[podKey] = (podMembersCount[podKey] || 0) + 1;
          podMetaByKey[podKey] = {
            podNumber: podNumber || "--",
            podName: podName || "--",
            podTier: getValue(row, columnMap.podTier) || "--"
          };
        }
        const tier = normalizeValue(getValue(row, columnMap.podTier));
        if (tier) {
          tierCounts[tier] = (tierCounts[tier] || 0) + 1;
        }

        const leader = normalizeValue(getValue(row, columnMap.leader));
        if (leader) {
          leaderCounts[leader] = (leaderCounts[leader] || 0) + 1;
        }

        const roll = normalizeValue(getValue(row, columnMap.rollStatus));
        if (roll.includes("on")) {
          onRoll += 1;
        } else if (roll.includes("off")) {
          offRoll += 1;
        }

        const roleRaw = getValue(row, columnMap.role);
        const roleValue = normalizeValue(roleRaw);
        const roleBucketKey = getRoleBucket(roleValue);
        const rowTitleValue = normalizeValue(getValue(row, columnMap.rowTitle) || roleRaw);
        if (roleBucketKey && roleBuckets[roleBucketKey]) {
          roleBuckets[roleBucketKey].total += 1;
          if (roll.includes("on")) {
            roleBuckets[roleBucketKey].on += 1;
          } else if (roll.includes("off")) {
            roleBuckets[roleBucketKey].off += 1;
          }
        }
        if (rowTitleValue.includes("sdm") && moduleHeaders.length && podKey) {
          if (!podModulesMap[podKey]) {
            podModulesMap[podKey] = new Set();
          }
          moduleHeaders.forEach((header) => {
            const moduleValue = String(getValue(row, header) || "").trim();
            if (moduleValue) {
              podModulesMap[podKey].add(moduleValue);
            }
          });
        }
        const isLeaderRole = isLeadershipRole(roleValue);
        if (hasBandColumn && roll.includes("on") && !isLeaderRole) {
          const bandRaw = getValue(row, columnMap.band);
          const bandNormalized = normalizeValue(bandRaw);
          if (bandNormalized && bandNormalized !== "na" && bandNormalized !== "n/a") {
            const bandLabel = String(bandRaw).trim();
            const roleLabel =
              roleBucketKey && roleBuckets[roleBucketKey]
                ? roleBuckets[roleBucketKey].label
                : roleRaw
                ? String(roleRaw).trim()
                : "--";
            bandSet.add(bandLabel);
            roleSet.add(roleLabel);
            if (!bandRoleMap[bandLabel]) {
              bandRoleMap[bandLabel] = {};
            }
            bandRoleMap[bandLabel][roleLabel] = (bandRoleMap[bandLabel][roleLabel] || 0) + 1;
          }
        }
        if (hasLocationColumn && !isLeaderRole) {
          const locationRaw = getValue(row, columnMap.location);
          const locationNormalized = normalizeValue(locationRaw);
          const locationLabel = String(locationRaw || "").trim();
          if (locationNormalized) {
            if (roll.includes("on")) {
              if (locationNormalized.includes("pune")) {
                onRollLocations.pune += 1;
              } else if (locationNormalized.includes("odc")) {
                onRollLocations.odc += 1;
              } else {
                onRollLocations.other += 1;
              }
            } else if (roll.includes("off") && locationLabel) {
              const resourceName = normalizeValue(getValue(row, columnMap.resourceName));
              if (!offRollLocationSets[locationLabel]) {
                offRollLocationSets[locationLabel] = new Set();
              }
              if (resourceName) {
                offRollLocationSets[locationLabel].add(resourceName);
              }
            }
          }
        }

        if (hasLeadershipColumns) {
          Object.entries(leadershipColumns).forEach(([roleLabel, header]) => {
            splitNames(getValue(row, header)).forEach((name) => {
              leadershipRoleCounts[roleLabel].add(name);
            });
          });
        } else {
          const leaderName = getValue(row, columnMap.resourceName) || getValue(row, columnMap.leader);
          if (leaderName) {
            Object.entries(CONFIG.leadershipRoleFilters).forEach(([roleLabel, patterns]) => {
              if (patterns.some((pattern) => roleValue.includes(pattern))) {
                leadershipRoleCounts[roleLabel].add(leaderName);
              }
            });
          }
        }
      });

      const podTierSets = {
        twelve: new Set(),
        eight: new Set(),
        tech: new Set()
      };
      rawData.forEach((row) => {
        const podName = getValue(row, columnMap.podName) || "(unassigned)";
        const tierValue = normalizeValue(getValue(row, columnMap.podTier));
        if (tierValue.includes("12")) {
          podTierSets.twelve.add(podName);
        }
        if (tierValue.includes("8")) {
          podTierSets.eight.add(podName);
        }
        if (tierValue.includes("tech")) {
          podTierSets.tech.add(podName);
        }
      });

      const leadershipTotal = Object.values(leadershipRoleCounts).reduce((sum, set) => sum + set.size, 0);
      const teamSize = roleBuckets.sdm.total + roleBuckets.developer.total + roleBuckets.pmo.total + roleBuckets.qa.total + leadershipTotal;

      const podSizeCounts = {
        twelve: podTierSets.twelve.size,
        eight: podTierSets.eight.size
      };
      const techPodCount = podTierSets.tech.size;

      const ownershipOptions = CONFIG.leadershipRoleOptions.filter((role) => role !== "All");
      const ownershipRole = ownershipOptions.includes(page1Ui.ownershipRole) ? page1Ui.ownershipRole : ownershipOptions[0] || "";
      const ownershipLeaders = ownershipMap.roles[ownershipRole] || {};
      const leaderOptions = Object.keys(ownershipLeaders).sort();
      const selectedLeader = leaderOptions.includes(page1Ui.ownershipLeader)
        ? page1Ui.ownershipLeader
        : leaderOptions[0] || "";
      const selectedPods = selectedLeader ? ownershipLeaders[selectedLeader] || [] : [];
      const podModules = Object.fromEntries(
        Object.entries(podModulesMap).map(([key, set]) => [key, Array.from(set).sort().join(", ")])
      );
      const ownershipMetrics = buildOwnershipMetrics(selectedPods, podMembersCount, podModules);
      const bandMatrix = {
        bands: Array.from(bandSet).sort(),
        roles: Array.from(roleSet).sort(),
        counts: bandRoleMap
      };
      const offRollLocations = Object.entries(offRollLocationSets)
        .map(([location, names]) => ({
          location,
          count: names.size
        }))
        .sort((a, b) => b.count - a.count || a.location.localeCompare(b.location));

      return {
        totalPods: podKeySet.size,
        totalSeats: rawData.length,
        onRoll,
        offRoll,
        tierCounts,
        leaderCounts,
        roleBuckets,
        teamSize,
        leadershipRoleCounts: Object.fromEntries(
          Object.entries(leadershipRoleCounts).map(([key, set]) => [key, set.size])
        ),
        leadershipTotal,
        podSizeBars: [
          { label: "12 member POD", value: podSizeCounts.twelve },
          { label: "8 member POD", value: podSizeCounts.eight },
          { label: "Tech POD", value: techPodCount }
        ],
        insights: {
          hasBandColumn,
          hasLocationColumn,
          bandMatrix,
          location: {
            onRoll: onRollLocations,
            offRoll: offRollLocations
          }
        },
        ownership: {
          roleOptions: ownershipOptions,
          leaderOptions,
          selectedRole: ownershipRole,
          selectedLeader,
          metrics: ownershipMetrics
        }
      };
    }

    function derivePage2(headers, rawData, page2Ui, headerIssues) {
      let rows = [...rawData];
      const columnMap = mapColumns(headers);
      const searchTerm = page2Ui.searchTerm.toLowerCase();

      if (page2Ui.tierFilter !== "All" && columnMap.podTier) {
        rows = rows.filter((row) => normalizeValue(getValue(row, columnMap.podTier)) === page2Ui.tierFilter.toLowerCase());
      }

      if (page2Ui.rollFilter !== "All" && columnMap.rollStatus) {
        rows = rows.filter((row) => normalizeValue(getValue(row, columnMap.rollStatus)).includes(page2Ui.rollFilter.toLowerCase()));
      }

      if (searchTerm) {
        rows = rows.filter((row) => headers.some((header) => String(row[header] || "").toLowerCase().includes(searchTerm)));
      }

      if (page2Ui.sortKey) {
        rows.sort((a, b) => {
          const aValue = String(a[page2Ui.sortKey] || "").toLowerCase();
          const bValue = String(b[page2Ui.sortKey] || "").toLowerCase();
          if (aValue < bValue) return page2Ui.sortDir === "asc" ? -1 : 1;
          if (aValue > bValue) return page2Ui.sortDir === "asc" ? 1 : -1;
          return 0;
        });
      }

      const tierOptions = columnMap.podTier
        ? Array.from(new Set(rawData.map((row) => normalizeValue(getValue(row, columnMap.podTier))).filter(Boolean)))
        : [];
      const rollOptions = columnMap.rollStatus
        ? Array.from(new Set(rawData.map((row) => normalizeValue(getValue(row, columnMap.rollStatus))).filter(Boolean)))
        : [];

      return {
        rows,
        headers,
        tierOptions,
        rollOptions,
        headerIssues
      };
    }

    function derivePage3(headers, rawData) {
      const columnMap = mapColumns(headers);
      const podGroups = groupBy(rawData, (row) => getValue(row, columnMap.podNumber) || getValue(row, columnMap.podName) || "(unassigned)");
      const leadershipColumns = getLeadershipColumns(columnMap);
      const missingColumns = [];
      const podIssueMap = {};

      const requireColumns = (label, keys) => {
        const missing = keys.filter((key) => !columnMap[key]);
        if (missing.length) {
          missingColumns.push(`${label}: missing ${missing.join(", ")}`);
        }
      };

      requireColumns("POD Structure", ["podNumber", "podName", "podTier", "role", "rollStatus"]);
      requireColumns("Duplicates", ["resourceName", "podNumber", "role"]);
      requireColumns("On/Off Roll", ["podTier", "role", "rollStatus"]);
      const missingLeadership = Object.entries(leadershipColumns)
        .filter(([, header]) => !header)
        .map(([label]) => label);
      if (missingLeadership.length === Object.keys(leadershipColumns).length) {
        missingColumns.push("Leadership Assignments: missing leadership columns");
      } else if (missingLeadership.length) {
        missingColumns.push(`Leadership Assignments: missing ${missingLeadership.join(", ")}`);
      }

      const structureMismatch = [];
      const leadershipIssues = {
        pmoSenior: [],
        principal: [],
        technical: [],
        pmoLead: [],
        qaLead: []
      };
      const duplicates = {
        confirmed: [],
        possible: []
      };
      const onOffIssues = [];

      const expectedStructures = {
        "12 member": [
          { role: "sdm", roll: "on", count: 1 },
          { role: "dev", roll: "on", count: 2 },
          { role: "dev", roll: "off", count: 5 },
          { role: "pmo", roll: "on", count: 2 },
          { role: "qa", roll: "on", count: 1 },
          { role: "qa", roll: "off", count: 1 }
        ],
        "8 member": [
          { role: "sdm", roll: "on", count: 1 },
          { role: "dev", roll: "on", count: 1 },
          { role: "dev", roll: "off", count: 4 },
          { role: "pmo", roll: "on", count: 1 },
          { role: "qa", roll: "off", count: 1 }
        ],
        "tech pod": [
          { role: "sdm", roll: "on", count: 1 },
          { role: "dev", roll: "on", count: 1 },
          { role: "dev", roll: "off", count: 4 },
          { role: "pmo", roll: "on", count: 1 }
        ]
      };

      const getTierKey = (tierValue) => {
        if (!tierValue) return "";
        if (tierValue.includes("12")) return "12 member";
        if (tierValue.includes("8")) return "8 member";
        if (tierValue.includes("tech")) return "tech pod";
        return "";
      };

      const getRollKey = (rollValue) => {
        if (rollValue.includes("off")) return "off";
        if (rollValue.includes("on")) return "on";
        return "";
      };

      const roleTypeFromTitle = (roleValue) => {
        if (!roleValue) return "";
        if (roleValue.includes("sdm") || roleValue.includes("service delivery")) return "sdm";
        if (roleValue.includes("pmo")) return "pmo";
        if (roleValue.includes("qa") || roleValue.includes("quality")) return "qa";
        if (roleValue.includes("dev") || roleValue.includes("developer") || roleValue.includes("engineer")) return "dev";
        return "";
      };

      const leadershipOrder = [
        { label: "PMO Senior Lead", header: leadershipColumns["PMO Senior Lead"] },
        { label: "Principal Architect", header: leadershipColumns["Principal Architect"] },
        { label: "Technical Architect", header: leadershipColumns["Technical Architect"] },
        { label: "PMO Lead", header: leadershipColumns["PMO Lead"] },
        { label: "QA Lead", header: leadershipColumns["QA Leads"] }
      ];

      const getPodKey = (row) => getValue(row, columnMap.podNumber) || getValue(row, columnMap.podName) || "(unassigned)";

      const ensurePodIssue = (row) => {
        const podKey = getPodKey(row);
        if (!podIssueMap[podKey]) {
          const podName = getValue(row, columnMap.podName) || "(unassigned)";
          const podNumber = getValue(row, columnMap.podNumber) || "--";
          const leaderEntry = leadershipOrder
            .map((entry) => splitNames(getValue(row, entry.header)))
            .find((names) => names.length);
          podIssueMap[podKey] = {
            podKey,
            podNumber,
            podName,
            leader: leaderEntry ? leaderEntry[0] : "--",
            issueCount: 0
          };
        }
        return podIssueMap[podKey];
      };

      Object.values(podGroups).forEach((rows) => {
        const podNumber = getValue(rows[0], columnMap.podNumber) || "--";
        const podName = getValue(rows[0], columnMap.podName) || "(unassigned)";
        const tierValue = normalizeValue(getValue(rows[0], columnMap.podTier));
        const tierKey = getTierKey(tierValue);
        const expectations = expectedStructures[tierKey] || [];
        if (!expectations.length) {
          return;
        }

        const actualCounts = {};
        rows.forEach((row) => {
          const roleValue = normalizeValue(getValue(row, columnMap.role));
          const rollValue = normalizeValue(getValue(row, columnMap.rollStatus));
          const roleType = roleTypeFromTitle(roleValue);
          const rollKey = getRollKey(rollValue);
          if (!roleType || !rollKey) return;
          const countKey = `${roleType}:${rollKey}`;
          actualCounts[countKey] = (actualCounts[countKey] || 0) + 1;
        });

        const reasons = [];
        const expectedKeys = new Set();
        expectations.forEach((expectation) => {
          const key = `${expectation.role}:${expectation.roll}`;
          expectedKeys.add(key);
          const actual = actualCounts[key] || 0;
          if (actual < expectation.count) {
            reasons.push(`Expected ${expectation.count} ${expectation.roll.toUpperCase()} ${expectation.role.toUpperCase()}, found ${actual}`);
          }
          if (actual > expectation.count) {
            reasons.push(
              `Expected ${expectation.count} ${expectation.roll.toUpperCase()} ${expectation.role.toUpperCase()}, found ${actual} (exceeds)`
            );
          }
        });

        Object.entries(actualCounts).forEach(([key, count]) => {
          if (!expectedKeys.has(key) && count > 0) {
            const [roleLabel, rollLabel] = key.split(":");
            reasons.push(`Unexpected ${rollLabel.toUpperCase()} ${roleLabel.toUpperCase()} count ${count}`);
          }
        });

        if (reasons.length) {
          structureMismatch.push({
            pod: podNumber,
            podName,
            tier: tierKey,
            reasons
          });
          const issuePod = ensurePodIssue(rows[0]);
          issuePod.issueCount += reasons.length;
        }
      });

      Object.values(podGroups).forEach((rows) => {
        const podNumber = getValue(rows[0], columnMap.podNumber) || "--";
        const podName = getValue(rows[0], columnMap.podName) || "(unassigned)";
        const podLabel = `${podNumber} — ${podName}`;
        const checks = [
          { key: "pmoSenior", label: "PMO Senior Lead", header: leadershipColumns["PMO Senior Lead"] },
          { key: "principal", label: "Principal Architect", header: leadershipColumns["Principal Architect"] },
          { key: "technical", label: "Technical Architect", header: leadershipColumns["Technical Architect"] },
          { key: "pmoLead", label: "PMO Lead", header: leadershipColumns["PMO Lead"] },
          { key: "qaLead", label: "QA Lead", header: leadershipColumns["QA Leads"] }
        ];
        checks.forEach((check) => {
          if (!check.header) return;
          const value = getValue(rows[0], check.header);
          const names = splitNames(value);
          if (!names.length) {
            leadershipIssues[check.key].push({ pod: podLabel, reason: `${check.label} is missing` });
            const issuePod = ensurePodIssue(rows[0]);
            issuePod.issueCount += 1;
          }
        });
      });

      const resourceGroups = groupBy(rawData, (row) => normalizeValue(getValue(row, columnMap.resourceName)) || "(unnamed)");
      Object.entries(resourceGroups).forEach(([resourceName, rows]) => {
        if (!resourceName || resourceName === "(unnamed)" || isPlaceholderName(resourceName)) return;
        const uniquePods = new Map();
        rows.forEach((row) => {
          const pod = getPodKey(row) || "--";
          const role = getValue(row, columnMap.role) || "--";
          if (!uniquePods.has(pod)) {
            uniquePods.set(pod, role);
          }
        });
        if (uniquePods.size > 1) {
          duplicates.confirmed.push({
            name: resourceName,
            entries: Array.from(uniquePods.entries()).map(([pod, role]) => ({ pod, role }))
          });
          uniquePods.forEach((_, pod) => {
            if (!podIssueMap[pod]) {
              podIssueMap[pod] = {
                podKey: pod,
                podNumber: pod === "(unassigned)" ? "--" : pod,
                podName: pod,
                leader: "--",
                issueCount: 0
              };
            }
            podIssueMap[pod].issueCount += 1;
          });
        }
      });

      const normalizedNames = {};
      rawData.forEach((row) => {
        const rawName = getValue(row, columnMap.resourceName);
        if (!rawName || isPlaceholderName(rawName)) return;
        const normalized = rawName.toLowerCase().replace(/[^a-z0-9]/g, "");
        if (!normalized) return;
        normalizedNames[normalized] = normalizedNames[normalized] || new Set();
        normalizedNames[normalized].add(rawName);
      });
      Object.entries(normalizedNames).forEach(([normalized, nameSet]) => {
        if (nameSet.size > 1) {
          const pods = new Set();
          rawData.forEach((row) => {
            const rawName = getValue(row, columnMap.resourceName);
            if (!rawName) return;
            const compare = rawName.toLowerCase().replace(/[^a-z0-9]/g, "");
            if (compare !== normalized) return;
            const pod = getValue(row, columnMap.podNumber) || getValue(row, columnMap.podName) || "--";
            pods.add(pod);
          });
          duplicates.possible.push({
            nameVariants: Array.from(nameSet),
            pods: Array.from(pods)
          });
          pods.forEach((pod) => {
            if (!podIssueMap[pod]) {
              podIssueMap[pod] = {
                podKey: pod,
                podNumber: pod === "(unassigned)" ? "--" : pod,
                podName: pod,
                leader: "--",
                issueCount: 0
              };
            }
            podIssueMap[pod].issueCount += 1;
          });
        }
      });

      rawData.forEach((row) => {
        const tierKey = getTierKey(normalizeValue(getValue(row, columnMap.podTier)));
        const roleValue = normalizeValue(getValue(row, columnMap.role));
        const rollValue = normalizeValue(getValue(row, columnMap.rollStatus));
        const roleLabel = getValue(row, columnMap.role) || "--";
        const roleType = roleTypeFromTitle(roleValue);
        const rollKey = getRollKey(rollValue);
        if (!tierKey || !roleType || !rollKey) return;

        const pod = getValue(row, columnMap.podNumber) || getValue(row, columnMap.podName) || "--";
        const resource = getValue(row, columnMap.resourceName) || "--";
        if ((roleType === "sdm" || roleType === "pmo") && rollKey !== "on") {
          onOffIssues.push({ pod, role: roleLabel, resource, reason: `${roleType.toUpperCase()} must be On-Roll` });
          const issuePod = ensurePodIssue(row);
          issuePod.issueCount += 1;
        }
        if (roleType === "qa" && tierKey === "8 member" && rollKey !== "off") {
          onOffIssues.push({ pod, role: roleLabel, resource, reason: "QA must be Off-Roll for 8 Member POD" });
          const issuePod = ensurePodIssue(row);
          issuePod.issueCount += 1;
        }
      });

      const podIssueSummary = Object.values(podIssueMap).sort((a, b) => b.issueCount - a.issueCount);
      const podIssueBuckets = {
        critical: podIssueSummary.filter((pod) => pod.issueCount >= 5),
        significant: podIssueSummary.filter((pod) => pod.issueCount >= 3 && pod.issueCount <= 4),
        improvement: podIssueSummary.filter((pod) => pod.issueCount >= 1 && pod.issueCount <= 2),
        perfect: podIssueSummary.filter((pod) => pod.issueCount === 0)
      };
      const podOptions = [
        { value: "All", label: "All PODs" },
        ...Object.values(podGroups)
          .map((rows) => ({
            value: getValue(rows[0], columnMap.podNumber) || getValue(rows[0], columnMap.podName) || "(unassigned)",
            label: `${getValue(rows[0], columnMap.podNumber) || "--"} — ${getValue(rows[0], columnMap.podName) || "(unassigned)"}`
          }))
          .sort((a, b) => a.label.localeCompare(b.label))
      ];

      return {
        structureMismatch,
        leadershipIssues,
        duplicates,
        onOffIssues,
        missingColumns,
        podIssueSummary,
        podIssueBuckets,
        podOptions
      };
    }

    function normalizeHeader(header) {
      return String(header || "")
        .toLowerCase()
        .replace(/["']/g, "")
        .replace(/[\r\n]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function mapColumns(headers) {
      const normalized = headers.map((item) => ({ raw: item, normalized: normalizeHeader(item) }));
      const lookup = (patterns) => {
        const normalizedPatterns = patterns.map((pattern) => normalizeHeader(pattern));
        const match = normalized.find((item) => normalizedPatterns.some((pattern) => item.normalized.includes(pattern)));
        return match ? match.raw : "";
      };
      return {
        podNumber: lookup(["# pod", "pod #", "pod number", "pod no", "pod id"]),
        podName: lookup(["pod name"]),
        podTier: lookup(["tier"]),
        serialNumber: lookup(["s.no", "s no", "sno", "serial"]),
        leader: lookup(["leader", "owner", "pod lead"]),
        resourceName: lookup(["resource name", "resource", "member", "employee", "associate", "person"]),
        role: lookup(["role", "position", "title", "leadership"]),
        rowTitle: lookup(["row title", "row", "role title"]),
        rollStatus: lookup(["roll", "status", "on/off"]),
        pmoSeniorLead: lookup(["pmo senior lead", "pmo sr lead", "senior pmo lead"]),
        principalArchitect: lookup(["principal architect", "principal arch"]),
        technicalArchitect: lookup(["technical architect", "tech architect"]),
        pmoLead: lookup(["pmo lead"]),
        qaLead: lookup(["qa lead", "qa leads", "quality lead"]),
        band: lookup(["band", "grade", "job band"]),
        location: lookup(["location", "base location", "site"]),
        azurePodName: lookup(["azure pod name", "azure pod"]),
        module1: lookup(["module1", "module 1"]),
        module2: lookup(["module2", "module 2"]),
        module3: lookup(["module3", "module 3"]),
        module4: lookup(["module4", "module 4"]),
        module5: lookup(["module5", "module 5"]),
        module6: lookup(["module6", "module 6"]),
        module7: lookup(["module7", "module 7"]),
        module8: lookup(["module8", "module 8"]),
        module9: lookup(["module9", "module 9"]),
        module10: lookup(["module10", "module 10"])
      };
    }

    function getValue(row, header) {
      if (!header) return "";
      return row[header] ?? "";
    }

    function normalizeValue(value) {
      return String(value || "").trim().toLowerCase();
    }

    function isPlaceholderName(value) {
      const normalized = normalizeValue(value);
      return normalized.includes("tbh") || normalized.includes("tbd") || normalized.includes("to be hired");
    }

    function splitNames(value) {
      return String(value || "")
        .split(/[,/;]+/)
        .map((name) => name.trim())
        .filter((name) => {
          if (!name) return false;
          return !isPlaceholderName(name);
        });
    }

    function getLeadershipColumns(columnMap) {
      return {
        "PMO Senior Lead": columnMap.pmoSeniorLead,
        "PMO Lead": columnMap.pmoLead,
        "Principal Architect": columnMap.principalArchitect,
        "Technical Architect": columnMap.technicalArchitect,
        "QA Leads": columnMap.qaLead
      };
    }

    function isLeadershipRole(roleValue) {
      if (!roleValue) return false;
      return Object.values(CONFIG.leadershipRoleFilters).some((patterns) =>
        patterns.some((pattern) => roleValue.includes(pattern))
      );
    }

    function groupBy(rows, keyFn) {
      return rows.reduce((acc, row) => {
        const key = keyFn(row);
        if (!acc[key]) acc[key] = [];
        acc[key].push(row);
        return acc;
      }, {});
    }

    function getRoleBucket(roleValue) {
      if (!roleValue) return "";
      if (roleValue.includes("sdm") || roleValue.includes("service delivery")) return "sdm";
      if (roleValue.includes("pmo")) return "pmo";
      if (roleValue.includes("qa") || roleValue.includes("quality")) return "qa";
      if (roleValue.includes("developer") || roleValue.includes("engineer") || roleValue.includes("dev")) return "developer";
      return "";
    }

    function buildOwnershipMap(rawData, columnMap) {
      const roles = { All: {} };
      CONFIG.leadershipRoleOptions.forEach((role) => {
        if (role !== "All") {
          roles[role] = {};
        }
      });

      const leadershipColumns = getLeadershipColumns(columnMap);
      const hasLeadershipColumns = Object.values(leadershipColumns).some(Boolean);

      rawData.forEach((row) => {
        if (hasLeadershipColumns) {
          Object.entries(leadershipColumns).forEach(([roleLabel, header]) => {
            if (!roles[roleLabel]) return;
            splitNames(getValue(row, header)).forEach((name) => {
              addOwnershipRecord(roles.All, name, row, columnMap);
              addOwnershipRecord(roles[roleLabel], name, row, columnMap);
            });
          });
          return;
        }

        const leaderName = getValue(row, columnMap.resourceName) || getValue(row, columnMap.leader);
        if (!leaderName) return;

        const roleValue = normalizeValue(getValue(row, columnMap.role));
        addOwnershipRecord(roles.All, leaderName, row, columnMap);

        Object.entries(CONFIG.leadershipRoleFilters).forEach(([roleLabel, patterns]) => {
          if (!roles[roleLabel]) return;
          if (patterns.some((pattern) => roleValue.includes(pattern))) {
            addOwnershipRecord(roles[roleLabel], leaderName, row, columnMap);
          }
        });
      });

      return { roles };
    }

    function addOwnershipRecord(targetMap, leaderName, row, columnMap) {
      if (!targetMap[leaderName]) {
        targetMap[leaderName] = [];
      }
      const podName = getValue(row, columnMap.podName) || "(unassigned)";
      const podNumber = getValue(row, columnMap.podNumber) || "--";
      const podTier = getValue(row, columnMap.podTier) || "--";
      const podKey = podNumber !== "--" ? podNumber : podName;
      const existing = targetMap[leaderName].find((pod) => pod.podKey === podKey);
      if (!existing) {
        targetMap[leaderName].push({
          podKey,
          podNumber,
          podName,
          podTier
        });
      }
    }

    function buildOwnershipMetrics(pods, podMembersCount, podModules) {
      const podList = pods.map((pod) => ({
        ...pod,
        size: podMembersCount[pod.podKey] || 0,
        modules: podModules[pod.podKey] || "--"
      }));
      const podsOwned = podList.length;
      const pods12 = podList.filter((pod) => pod.size === 12).length;
      const pods8 = podList.filter((pod) => pod.size === 8).length;
      return {
        podsOwned,
        pods12,
        pods8,
        podList
      };
    }
